services:
  # 1. O servidor backend (Tracker)
  tracker:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - onion_p2p

  # 2. Tor hidden service → tracker HTTP (must use 127.0.0.1: Tor rejects Docker DNS hostnames in HiddenServicePort)
  tor_service:
    build:
      context: .
      dockerfile: Dockerfile.tor
    restart: unless-stopped
    # Share tracker's network namespace so HiddenServicePort can target 127.0.0.1:8080 (Axum).
    network_mode: "service:tracker"
    depends_on:
      - tracker
    volumes:
      # Esse volume salva sua chave do domínio Tor (MUITO IMPORTANTE!)
      # Se você deletar o disco docker e não fizer backup, seu link .onion mudará
      # e todas as versões do App já instaladas pela internet "ficarão sem lobby".
      - tor_keys:/var/lib/tor/hidden_service/

volumes:
  tor_keys:


networks:
  onion_p2p:
